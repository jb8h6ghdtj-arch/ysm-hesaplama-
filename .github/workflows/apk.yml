name: APK derle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk YSM-Hesaplama.apk
      - uses: actions/upload-artifact@v4
        with: { name: YSM-Hesaplama-apk, path: YSM-Hesaplama.apk }
      - name: APK'yı Releases'a koy (telefondan indirmek için)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" YSM-Hesaplama.apk --title "YSM Hesaplama $TAG" --notes "Telefona indirip kurun." --latest
